server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log off;
  error_log /dev/null;
  client_max_body_size 2m;
  set_real_ip_from 172.30.0.5;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  add_header_inherit merge;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 90s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    add_header Cache-Control no-store always;
  }
  location /health/ { proxy_pass http://api:8000; proxy_set_header Host $host; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location /reports/ { add_header Cache-Control no-store always; add_header X-Robots-Tag "noindex, nofollow" always; try_files /index.html =404; }
  location / { add_header Cache-Control no-store always; try_files $uri $uri/ /index.html; }
}
