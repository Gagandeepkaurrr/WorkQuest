name: workquest-production
x-app: &app
  image: ${API_IMAGE:?Set an immutable API image digest}
  env_file: ${APP_ENV_FILE:?Set absolute private environment file}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  networks: [private]
services:
  db:
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    environment:
      POSTGRES_USER: workquest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure a secret}
      POSTGRES_DB: workquest
    volumes: [pgdata:/var/lib/postgresql]
    networks: [private]
    restart: unless-stopped
    healthcheck: {test: [CMD-SHELL, "pg_isready -U workquest -d workquest"], interval: 10s, timeout: 5s, retries: 10}
  redis:
    image: redis:8.4.0-alpine@sha256:4eec4565e45aa0b3966554c866bc73211e281b0b3d89fe9a33c982e6faca809d
    command: [redis-server, --appendonly, "yes", --maxmemory, 256mb, --maxmemory-policy, noeviction]
    volumes: [redisdata:/data]
    networks: [private]
    restart: unless-stopped
  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    restart: "no"
    profiles: [maintenance]
  api:
    <<: *app
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000", --no-access-log, --proxy-headers, --forwarded-allow-ips, "172.30.0.4"]
    healthcheck: {test: [CMD, python, -m, app.cli.healthcheck], interval: 15s, timeout: 6s, retries: 5}
  worker:
    <<: *app
    command: [celery, -A, app.jobs.celery_app:celery, worker, --concurrency=2, --loglevel=WARNING, --without-gossip, --without-mingle]
  dispatcher:
    <<: *app
    command: [python, -m, app.jobs.dispatcher]
  cleanup:
    <<: *app
    command: [python, -m, app.cli.cleanup]
    restart: "no"
    profiles: [maintenance]
  web:
    image: ${WEB_IMAGE:?Set an immutable frontend image digest}
    restart: unless-stopped
    networks:
      private: {ipv4_address: 172.30.0.4}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  edge:
    image: caddy:2.10.2-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment: {APP_DOMAIN: "${APP_DOMAIN:?Set the application hostname}"}
    volumes: ["./caddy/Caddyfile:/etc/caddy/Caddyfile:ro", caddydata:/data, caddyconfig:/config]
    restart: unless-stopped
    networks:
      private: {ipv4_address: 172.30.0.5}
networks:
  private:
    ipam:
      config: [{subnet: 172.30.0.0/24}]
volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
