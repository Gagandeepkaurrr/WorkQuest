name: workquest
services:
  db:
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    environment:
      POSTGRES_USER: workquest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/local-env.py}
      POSTGRES_DB: workquest
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workquest -d workquest"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.4.0-alpine@sha256:4eec4565e45aa0b3966554c866bc73211e281b0b3d89fe9a33c982e6faca809d
    ports: ["127.0.0.1:56379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:51025:1025"]
volumes:
  pgdata:
  redisdata:
